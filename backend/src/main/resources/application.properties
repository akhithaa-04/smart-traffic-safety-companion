# ===== Smart Traffic Safety Companion - Backend Configuration =====

spring.application.name=smart-traffic-safety-companion

# ---- DEV DATABASE (H2 in-memory) ----
# Runs instantly with zero setup - good for local dev and demos.
spring.datasource.url=jdbc:h2:mem:stscdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- PRODUCTION DATABASE (PostgreSQL) ----
# Production values will be supplied through environment variables.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Loads sample seed data (users, badges, reports) on startup - set to false to start empty
app.seed-demo-data=true